<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AlmaMundi OG</title>
    <style>
      :root {
        --font-sans: system-ui, -apple-system, "Segoe UI", Avenir, sans-serif;
        --home-bg: #e0e5ec;
        --almamundi-orange: #ab301c;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #e0e5ec;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 48px 64px 52px;
        background: #e0e5ec;
        font-family: var(--font-sans);
      }
      .almamundi-footer-brand {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;
        overflow-x: clip;
        text-align: center;
        container-type: inline-size;
      }
      /* Copia literal de `.almamundi-footer-title` en app/globals.css */
      .almamundi-footer-title {
        display: block;
        width: max-content;
        max-width: 100%;
        text-align: center;
        margin-inline: auto;
        padding-inline-end: 0.06em;
        color: #e0e5ec;
        font-family: var(--font-sans);
        font-weight: 900;
        font-size: clamp(3rem, 16.5cqi, 12rem);
        letter-spacing: -0.06em;
        line-height: 0.9;
        white-space: nowrap;
        text-shadow:
          -0.01em -0.01em 0.02em rgba(255, 255, 255, 0.95),
          0.01em 0.01em 0.02em rgba(163, 177, 198, 0.85),
          -0.03em -0.03em 0.06em rgba(255, 255, 255, 0.8),
          0.03em 0.03em 0.06em rgba(163, 177, 198, 0.7),
          -0.06em -0.06em 0.12em rgba(255, 255, 255, 0.6),
          0.06em 0.06em 0.12em rgba(163, 177, 198, 0.5);
      }
      .tagline {
        margin: 0;
        max-width: 46rem;
        color: #ab301c;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.01em;
        text-align: center;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 4px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        border: 1px solid #ab301c;
        background: #ab301c;
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.55rem 1.15rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="almamundi-footer-brand">
        <span class="almamundi-footer-title">AlmaMundi</span>
      </div>
      <p class="tagline">
        Descubre historias reales en video, audio o texto — y entra a contar la tuya.
      </p>
      <div class="pills">
        <span class="pill">Video</span>
        <span class="pill">Audio</span>
        <span class="pill">Escrito</span>
        <span class="pill">Foto</span>
      </div>
    </div>
  </body>
</html>
